name: build_and_deploy
on: workflow_dispatch
env:
  IMAGE_NAME: ${{secrets.REGISTRY}}/popframe_api
  CONTAINER_NAME: popframe_api

jobs:
  build:
    runs-on: 42_runner
    outputs:
      now: ${{steps.date.outputs.NOW}}
    steps:
      - name: Set current date as env variable
        id: date
        run: echo "NOW=$(date +'%Y-%m-%dT%H-%M-%S')" >> $GITHUB_OUTPUT
      - name: checkout
        uses: actions/checkout@v4
      - name: Write env file
        env:
          # Settings -> Secrets and variables -> Actions
          #   Variables tab -> ENV_APP   (app params)
          #   Variables tab -> ENV_URLS  (service addresses)
          #   Secrets tab   -> ENV_SECRET (credentials)
          # Keys: see .env.example
          ENV_APP: ${{ vars.ENV_APP }}
          ENV_URLS: ${{ vars.ENV_URLS }}
          ENV_SECRET: ${{ secrets.ENV_SECRET }}
          ENV_FILE: ${{ secrets.ENV_FILE }}   # legacy fallback
          ENV_PATH: ${{ secrets.ENV_PATH }}   # legacy fallback
        run: |
          if [ -n "$ENV_APP" ] || [ -n "$ENV_URLS" ] || [ -n "$ENV_SECRET" ]; then
            : > .env.production
            [ -n "$ENV_APP" ] && printf '%s\n' "$ENV_APP" >> .env.production
            [ -n "$ENV_URLS" ] && printf '%s\n' "$ENV_URLS" >> .env.production
            [ -n "$ENV_SECRET" ] && printf '%s\n' "$ENV_SECRET" >> .env.production
            echo "Wrote .env.production from ENV_APP + ENV_URLS (vars) + ENV_SECRET (secret) ($(wc -l < .env.production) lines)"
          elif [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env.production
            echo "Wrote .env.production from ENV_FILE secret ($(wc -l < .env.production) lines)"
          elif [ -n "$ENV_PATH" ]; then
            cp "$ENV_PATH/.env.production" ./
            echo "Copied .env.production from ENV_PATH (fallback)"
          else
            # iduconfig refuses to start without .env.production, so fail the build here
            echo "::error::No ENV_APP/ENV_URLS/ENV_SECRET, ENV_FILE or ENV_PATH - .env.production not provided"
            exit 1
          fi
      - name: build
        env:
          NOW: ${{steps.date.outputs.now}}
        run: docker build -t "$IMAGE_NAME":"$NOW" .
      - name: push_to_registry
        env:
          NOW: ${{steps.date.outputs.now}}
        run: docker push "$IMAGE_NAME":"$NOW"
  stop_container:
    runs-on: 42_runner
    needs: build
    steps:
      - name: stop_container
        run: docker rm -f "$CONTAINER_NAME"
  run_container:
    runs-on: 42_runner
    needs: [build, stop_container]
    env:
      NOW: ${{needs.build.outputs.now}}
    steps:
      - name: set env
        run: echo "IMAGE=$IMAGE_NAME:$NOW" >> $GITHUB_ENV
      - name: run
#        run: docker run -d --name "$CONTAINER_NAME" --env-file ./.env.development -p 8210:8000 "$IMAGE_NAME":"$NOW"
        run: docker compose -f docker-compose.actions.yml up -d
